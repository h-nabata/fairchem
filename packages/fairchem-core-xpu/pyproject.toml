[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

[project]
name = "fairchem-core"
description = "Machine learning models for chemistry and materials science by the FAIR Chemistry team"
license = {text = "MIT License"}
dynamic = ["version", "readme"]
requires-python = ">=3.11, <3.15"
dependencies = [
    "torch==2.15.0+xpu",
    "triton-xpu>=3.9,<3.10.dev0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "numpy>=2.0,<2.5",
    "scipy>=1.15.0",
    "lmdb>=1.6.2,<=1.7.3",
    "numba>=0.62.0",
    "e3nn>=0.5",
    "huggingface_hub>=0.27.1",
    "ase>=3.26.0",
    "ase-db-backends>=0.10.0",
    "backoff",
    "monty>=2026.2.18",
    "clusterscope==0.0.18",
    "setuptools<81.0.0",
    "requests",
    "orjson",
    "tqdm",
    "submitit>=1.5.4",
    "hydra-core>=1.3",
    "torchtnt",
    "pyyaml",
    "wandb",
    "websockets",

]

[project.optional-dependencies]
nvidia = [
    "nvalchemi-toolkit-ops>=0.4.1",
    # UMA Nitro's CuTe kernels, imported only on Hopper and Blackwell GPUs. The
    # marker matches NVIDIA's wheels: other platforms skip these.
    "nvidia-cutlass-dsl==4.7.1; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
    "cuda-python>=12.8; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]
dev = ["pre-commit", "pytest", "pytest-cov", "coverage", "syrupy", "ruff==0.5.1", "ray[serve]>=2.56.1"]
docs = ["jupyter-book", "jupytext", "sphinx","sphinx-autoapi==3.3.3", "astroid<4", "umap-learn", "vdict", "ipywidgets", "jupyter_book>=2.0", "torch-dftd"]
adsorbml = ["dscribe", "x3dase", "scikit-image"]
regression = ["pymatgen>=2025.1.9", "phonopy>=2.37"]
torchsim = ["torch-sim-atomistic>=0.6.0; python_version >= '3.12'"]
extras = ["pymatgen>=2025.1.9", "quacc[phonons]>=0.15.3", "pandas", "pyarrow"]
# 2.56.1 is the first release whose ray.serve._private.config handles
# protobuf>=7 removing FieldDescriptor.label; older ray breaks serve.run.
ray = ["ray[serve]>=2.56.1"]

[project.scripts]
fairchem = "fairchem.core._cli:main"
fairchem-regression = "fairchem.core.regression_suite.cli:main"

[project.urls]
repository = "https://github.com/facebookresearch/fairchem"
home = "https://opencatalystproject.org/"
documentation = "https://facebookresearch.github.io/fairchem/"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-xpu" }
triton-xpu = { index = "pytorch-xpu" }

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../../"
git_describe_command = 'git describe --tags --match fairchem_core-*'

[tool.hatch.build]
directory = "../../dist-core-xpu"

[tool.hatch.build.targets.sdist]
only-include = ["src/fairchem/core", "src/fairchem/experimental"]

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/fairchem/core", "src/fairchem/experimental"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [
  { path = "src/fairchem/core/README.md" },
  { path = "src/fairchem/core/LICENSE.md" },
]
